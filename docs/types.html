<script>
(function(){
  var B = window.BASE_TYPES, S = window.SUBTYPES;
  var keys = Object.keys(B);

  /* 16グループ。チップから飛べるように id を振る */
  document.getElementById("groups").innerHTML = keys.map(function(k){
    var b = B[k];
    var cards = ["A-H","A-C","O-H","O-C"].map(function(sfx){
      var code = k + "-" + sfx;
      return '<a class="tcard" href="t/' + code + '/">' +
        '<span class="thumb"><img src="images/thumbs/' + code + '.webp" alt="' + code + ' ' + S[code].label + '" loading="lazy"></span>' +
        '<span class="tbody"><span class="tcode">' + code + '</span>' +
        '<span class="tlab" style="display:block">' + S[code].label + '</span>' +
        '<span class="tdesc" style="display:block">' + S[code].desc + '</span></span></a>';
    }).join("");
    return '<section class="group" id="g-' + k + '"><div class="group-head"><span class="gc">' + k + '</span>' +
           '<span class="gn">' + b.name + '</span><span class="gt">' + b.tagline + '</span></div>' +
           '<p class="group-sum">' + b.summary + '</p>' +
           '<div class="tgrid">' + cards + '</div></section>';
  }).join("");

  /* 移動用のチップ。押すとそのタイプの並びまでスクロールする */
  var bar = document.getElementById("gjump");
  bar.innerHTML = keys.map(function(k){
    return '<a href="#g-' + k + '" data-k="' + k + '"><span class="gj-c">' + k + '</span>' +
           '<span class="gj-n">' + B[k].name.replace("モンスター", "") + '</span></a>';
  }).join("");
  var links = {};
  Array.prototype.forEach.call(bar.querySelectorAll("a"), function(a){ links[a.getAttribute("data-k")] = a; });

  /* チップの帯のぶんだけ、飛び先を下にずらす（帯は共通ヘッダーの下に貼りつく） */
  function syncOffset(){
    document.documentElement.style.setProperty("--gjump-h", bar.offsetHeight + "px");
  }
  syncOffset();
  window.addEventListener("resize", syncOffset);

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function goTo(k, smooth){
    var el = document.getElementById("g-" + k);
    if (!el) return;
    el.scrollIntoView({ behavior: (smooth && !reduce) ? "smooth" : "auto", block: "start" });
  }
  bar.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest("a[data-k]") : null;
    if (!a) return;
    e.preventDefault();
    var k = a.getAttribute("data-k");
    goTo(k, true);
    if (history.replaceState) history.replaceState(null, "", "#g-" + k);
    setCurrent(k);
  });

  /* いま見ているグループのチップを塗る。押した先が分かるように、帯の中でも見える位置へ寄せる */
  var current = null;
  function setCurrent(k){
    if (k === current) return;
    if (current && links[current]) links[current].removeAttribute("aria-current");
    current = k;
    if (!links[k]) return;
    links[k].setAttribute("aria-current", "true");
    var a = links[k], l = a.offsetLeft, r = l + a.offsetWidth;
    if (l < bar.scrollLeft + 8) bar.scrollLeft = l - 8;
    else if (r > bar.scrollLeft + bar.clientWidth - 8) bar.scrollLeft = r - bar.clientWidth + 8;
  }
  if ("IntersectionObserver" in window){
    var headH = 64;
    var probe = getComputedStyle(document.documentElement).getPropertyValue("--head-h");
    if (probe) headH = parseInt(probe, 10) || 64;
    var obs = new IntersectionObserver(function(entries){
      /* 帯のすぐ下に入っているグループのうち、いちばん上のものを現在地にする */
      var vis = entries.filter(function(x){ return x.isIntersecting; });
      if (!vis.length) return;
      vis.sort(function(a, b){ return a.boundingClientRect.top - b.boundingClientRect.top; });
      setCurrent(vis[0].target.id.slice(2));
    }, { rootMargin: "-" + (headH + bar.offsetHeight + 4) + "px 0px -62% 0px", threshold: 0 });
    keys.forEach(function(k){ obs.observe(document.getElementById("g-" + k)); });
  }

  /* #g-INTJ 付きで開かれたとき。グループはJSで作るので、作ったあとに自分で飛ぶ */
  var m = /^#g-([A-Z]{4})$/.exec(location.hash || "");
  if (m && links[m[1]]){ goTo(m[1], false); setCurrent(m[1]); }
  else { setCurrent(keys[0]); }
})();
</script>
