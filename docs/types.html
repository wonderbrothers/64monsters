<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>64タイプ一覧｜64モンスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 表示設定を描画前に反映（ちらつき防止） */
(function(){try{var d=document.documentElement,t=localStorage.getItem("shindan64.v1.theme"),f=localStorage.getItem("shindan64.v1.fs");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}d.setAttribute("data-theme",t);d.setAttribute("data-fs",(f==="s"||f==="l")?f:"m");}catch(e){}})();
</script>

<style>
  #list{ padding:clamp(40px,8vh,80px) 0 90px; }
  .wrap.wide{ width:min(100% - 40px, 1080px); }
  .group{ padding:34px 0 30px; border-bottom:1px solid var(--line-2); }
  .group-head{ display:flex; align-items:baseline; flex-wrap:wrap; gap:12px; margin-bottom:6px; }
  .group-head .gc{ font-family:var(--f-mono); font-size:var(--fs-lg); letter-spacing:.06em; color:var(--shu); }
  .group-head .gn{ font-family:var(--f-disp); font-size:var(--fs-2xl); }
  .group-head .gt{ font-size:var(--fs-md); color:var(--ink-3); }
  .group-sum{ font-size:var(--fs-md); color:var(--ink-2); line-height:1.85; margin:0 0 18px; max-width:62em; }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap wide wrap-inner">
    <a class="qhome" href="index.html">← HOME</a>
    <span class="tb-title">64タイプ一覧</span>
  </div>
</div>

<section id="list" class="wrap wide">
  <p class="eyebrow">index</p>
  <h1 class="title" style="font-size:clamp(1.875rem, 5vw, 2.625rem)">64タイプ一覧</h1>
  <p class="lede">基本16タイプ × 決断のリズム（A / O）× 対人の温度（H / C）。カードをクリックすると詳しい解説が開きます。</p>
  <div id="groups" style="margin-top:10px"></div>
  <p class="note"><span class="copy">© 2026 WONDER BROTHERS INC. All rights reserved.</span></p>
</section>
<script src="assets/questions.js"></script>
<script src="assets/types.js"></script>
<script>
(function(){
  var B = window.BASE_TYPES, S = window.SUBTYPES;
  document.getElementById("groups").innerHTML = Object.keys(B).map(function(k){
    var b = B[k];
    var cards = ["A-H","A-C","O-H","O-C"].map(function(sfx){
      var code = k + "-" + sfx;
      return '<a class="tcard" href="index.html#' + code + '">' +
        '<span class="thumb"><img src="images/thumbs/' + code + '.webp" alt="' + code + ' ' + S[code].label + '" loading="lazy"></span>' +
        '<span class="tbody"><span class="tcode">' + code + '</span>' +
        '<span class="tlab" style="display:block">' + S[code].label + '</span>' +
        '<span class="tdesc" style="display:block">' + S[code].desc + '</span></span></a>';
    }).join("");
    return '<div class="group"><div class="group-head"><span class="gc">' + k + '</span>' +
           '<span class="gn">' + b.name + '</span><span class="gt">' + b.tagline + '</span></div>' +
           '<p class="group-sum">' + b.summary + '</p>' +
           '<div class="tgrid">' + cards + '</div></div>';
  }).join("");
})();
</script>
<script src="assets/settings.js"></script>
</body>
</html>
